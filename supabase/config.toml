# Local-only Supabase configuration for Fit Pro Player.
#
# This file intentionally contains no remote project reference, access token,
# or deployment credential. Link a project only through an explicitly
# authorized deployment workflow.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://www.fitpp.com.br"
additional_redirect_urls = [
  "https://www.fitpp.com.br/?auth_flow=confirm",
  "https://www.fitpp.com.br/?auth_flow=recovery",
  "http://127.0.0.1:8080/?auth_flow=confirm",
  "http://127.0.0.1:8080/?auth_flow=recovery",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false
