name: Quality
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci
      - run: npm test
      - run: npm run test:notifications
      - run: npm run check:supabase
      - run: node --test scripts/database-test-tap.test.mjs
      - run: npm --prefix frontend run check:i18n
      - run: npm --prefix frontend run test:fatigue-probe
      - run: npm run build
      - run: npm run build:vercel
      - run: npm --prefix frontend run build:mobile:web
      - run: npm run audit
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - run: npm --prefix frontend run test:e2e:pwa
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results/
            frontend/test-results-pwa/
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client
      - run: supabase start
      - run: supabase db reset
      - run: node scripts/run-database-tests.mjs
      - run: PG_BIN="$(pg_config --bindir)" READINESS_REQUIRE_DB=1 node --test scripts/check-professional-readiness-migration.test.mjs
      - run: PG_BIN="$(pg_config --bindir)" NOTIFICATIONS_REQUIRE_DB=1 node --test scripts/check-notification-migration.test.mjs
      - run: PG_BIN="$(pg_config --bindir)" PHOTOS_REQUIRE_DB=1 node --test scripts/check-professional-photos-migration.test.mjs
      - run: supabase stop --no-backup
        if: always()
